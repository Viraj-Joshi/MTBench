params:
  seed: ${...seed}
  algo:
    name: sapg_a2c

  model:
    name: mt_continuous_a2c_logstd

  network:
    name: asymmetric_a2c
    separate: True
    multi_head: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    actor:
      units: [256, 128, 64] # units in the actor critic network
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None
    critic:
      units: [256,256,256]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: ${if:${...checkpoint},True,False} # flag which sets whether to load the checkpoint
  load_path: ${...checkpoint} # path to the checkpoint to load

  config:
    name: ${resolve_default:mt_ppo,${....experiment}} 
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    normalize_reward: False
    value_bootstrap: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 10000
    max_epochs: ${resolve_default:3000,${....max_iterations}}
    save_best_after: 200
    save_frequency: 1500
    print_stats: True
    grad_norm: 1.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 98304
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    seq_len: 4
    bounds_loss_coef: 0.0001
    shuffle_data: True

    policy_embedding_dim: 16
    block_size: 4096 # determines the number of policies
    expl_reward_type: 'per-policy'
    expl_reward_coef_scale: 0.012 # is the max entropy coef assigned to the last follower and linearly decreases to 0 to the leader
    entropy_coef: 0.005 # used if expl_reward_type is 'none' and assigns constant entropy coef to all policies
    off_policy_ratio: 1.0
