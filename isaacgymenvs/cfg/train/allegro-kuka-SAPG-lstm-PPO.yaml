# SAPG with a shared recurrent (LSTM) trunk.
#
# Same as meta-world-mt50-vanilla-SAPG-PPO, but the shared asymmetric_a2c trunk
# (separate=False) is recurrent: obs -> LSTM -> MLP -> action/value, exactly like the
# vanilla/famo LSTM recipe. SAPG's per-policy embedding still runs before the LSTM.
#
# Recurrence is enabled purely by the `network.critic.rnn` block. The SAPG agent threads
# rnn_states through its policy split + off-policy augmentation and shuffles whole sequences
# (everything gated on is_rnn); with no rnn block this file behaves exactly like the FF SAPG.
#
# NOTE: seq_length must divide horizon_length. Here seq_length == horizon_length == 16
# (one BPTT sequence per actor per rollout).
params:
  seed: ${...seed}
  algo:
    name: sapg_a2c

  model:
    name: mt_continuous_a2c_logstd

  network:
    name: asymmetric_a2c
    separate: False
    multi_head: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    actor:
      units: [768, 512, 256]   # post-LSTM MLP of the shared trunk
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None
    critic:
      units: [768, 512, 256]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None
      # shared-trunk LSTM before the MLP
      rnn:
        name: lstm
        units: 768
        layers: 1
        before_mlp: True
        layer_norm: True

  load_checkpoint: ${if:${...checkpoint},True,False} # flag which sets whether to load the checkpoint
  load_path: ${...checkpoint} # path to the checkpoint to load

  config:
    name: ${resolve_default:mt_ppo,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    normalize_reward: False
    value_bootstrap: True
    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 1e9
    max_epochs: ${resolve_default:3000,${....max_iterations}}
    save_best_after: 200
    save_frequency: 20000
    print_stats: True
    grad_norm: 1.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 16384
    mini_epochs: 2        
    critic_coef: 4
    clip_value: True
    seq_length: 16          # BPTT window; must divide horizon_length
    bounds_loss_coef: 0.0001
    shuffle_data: True

    policy_embedding_dim: 32
    block_size: 4096 # determines the number of policies (num_envs // block_size)
    expl_reward_type: 'per-policy'
    expl_reward_coef_scale: 0.005
    entropy_coef: 0.005 # used if expl_reward_type is 'none' and assigns constant entropy coef to all policies
    off_policy_ratio: 1.0
