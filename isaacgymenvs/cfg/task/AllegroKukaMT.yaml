# Multi-task Allegro-Kuka task config for MTBench.
#
# Runs several single-arm Allegro-Kuka tasks at once, each occupying a contiguous
# block of environments (mirrors the franka meta-world-v2 multi-task setup).
# Supported task ids (see TASK_IDX_TO_NAME in vec_task/allegro_base.py):
#   0 -> regrasping, 1 -> throw, 2 -> reorientation
#
# `tasks` selects which tasks to run and `taskEnvCount` how many envs each gets;
# their sum must equal numEnvs. Most env.* params are lifted from the SAPG
# AllegroKuka.yaml so AllegroKukaBase's reward/curriculum machinery is unchanged.

name: AllegroKukaMT

physics_engine: physx

env:
  numEnvs: ${resolve_default:4096,${...num_envs}}
  envSpacing: 1.2
  episodeLength: 600
  enableDebugVis: False
  evalStats: False

  # ---- multi-task selection (driven by top-level hydra overrides, like meta-world-v2) ----
  tasks: ${...task_id}              # subset of {0:regrasping, 1:throw, 2:reorientation}
  taskEnvCount: ${...task_counts}   # must sum to numEnvs
  taskEmbedding: True              # append a one-hot task id to the observation

  # ---- per-subtask overrides (mirrors SAPG's per-subtask env configs) ----
  # the env-level values below are the reorientation/base defaults; these override per task.
  taskParams:
    regrasping:
      episodeLength: 400
      successSteps: 30          # hold a grasp for ~1s -> robust grasps
    throw:
      episodeLength: 300
      forceScale: 0.0           # random forces hurt precise throwing
      successTolerance: 0.075   # curriculum off (target == initial): hitting the bin is enough
      targetSuccessTolerance: 0.075
      successSteps: 5
      withSmallCuboids: True    # small objects only (must fit the bin)
      withBigCuboids: False
      withSticks: False
    reorientation:
      episodeLength: 600
      successSteps: 1

  clampAbsObservations: 10.0

  stiffnessScale: 1.0
  forceLimitScale: 1.0
  useRelativeControl: False
  dofSpeedScale: 10.0
  actionsMovingAverage: 1.0
  controlFrequencyInv: 1   # 60 Hz

  resetPositionNoiseX: 0.1
  resetPositionNoiseY: 0.1
  resetPositionNoiseZ: 0.02
  resetRotationNoise: 1.0
  resetDofPosRandomIntervalFingers: 0.1
  resetDofPosRandomIntervalArm: 0.1
  resetDofVelRandomInterval: 0.5

  # random forces applied to the object
  forceScale: 2.0
  forceProbRange: [0.001, 0.1]
  forceDecay: 0.99
  forceDecayInterval: 0.08

  liftingRewScale: 20.0
  liftingBonus: 300.0
  liftingBonusThreshold: 0.15
  keypointRewScale: 200.0
  distanceDeltaRewScale: 50.0
  reachGoalBonus: 1000.0
  kukaActionsPenaltyScale: 0.003
  allegroActionsPenaltyScale: 0.0003
  fallDistance: 0.24
  fallPenalty: 0.0

  privilegedActions: False
  privilegedActionsTorque: 0.02

  dofFriction: -1.0   # negative values are ignored; URDF default friction is used

  allegroStiffness: 40.0
  kukaStiffness: 40.0
  allegroEffort: 0.35
  kukaEffort: [300, 300, 300, 300, 300, 300, 300]
  allegroDamping: 5.0
  kukaDamping: 5.0
  allegroArmature: 0
  kukaArmature: 0

  keypointScale: 1.5
  objectBaseSize: 0.05

  randomizeObjectDimensions: True
  withSmallCuboids: True
  withBigCuboids: True
  withSticks: True

  objectType: "block"
  observationType: "full_state"
  successTolerance: 0.075
  targetSuccessTolerance: 0.01
  toleranceCurriculumIncrement: 0.9   # multiplicative
  toleranceCurriculumInterval: 3000   # in env steps across all agents
  maxConsecutiveSuccesses: 50
  successSteps: 1

  asset:
    kukaAllegro: "urdf/kuka_allegro_description/kuka_allegro_touch_sensor.urdf"
    assetFileNameBlock: "urdf/objects/cube_multicolor.urdf"

sim:
  substeps: 2
  dt: 0.01667   # 1/60
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  num_client_threads: 8
  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: ${....num_threads}
    solver_type: ${....solver_type}   # 0: pgs, 1: tgs
    use_gpu: ${contains:"cuda",${....sim_device}}
    num_position_iterations: 8
    num_velocity_iterations: 0
    max_gpu_contact_pairs: 8388608   # 8*1024*1024
    num_subscenes: ${....num_subscenes}
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 25.0
    contact_collection: 0

task:
  randomize: False
  # mirrors sapg/isaacgymenvs/cfg/task/AllegroKuka.yaml (applied only when randomize: True)
  randomization_params:
    frequency: 480   # Define how many simulation steps between generating new randomizations

    observations:
      range: [0, .002] # range for the white noise
      range_correlated: [0, .001 ] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
      schedule: "linear"   # "constant" is to turn on noise after `schedule_steps` num steps
      schedule_steps: 40000
    actions:
      range: [0., .05]
      range_correlated: [0, .015] # range for correlated noise, refreshed with freq `frequency`
      operation: "additive"
      distribution: "gaussian"
      schedule: "linear"  # "linear" will linearly interpolate between no rand and max rand
      schedule_steps: 40000

    sim_params:
    gravity:
      range: [0, 0.4]
      operation: "additive"
      distribution: "gaussian"
      schedule: "linear"  # "linear" will linearly interpolate between no rand and max rand
      schedule_steps: 40000

    actor_params:
      allegro:
        color: True
        dof_properties:
          damping:
            range: [0.3, 3.0]
            operation: "scaling"
            distribution: "loguniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
          stiffness:
            range: [0.75, 1.5]
            operation: "scaling"
            distribution: "loguniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
          lower:
            range: [0, 0.01]
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
          upper:
            range: [0, 0.01]
            operation: "additive"
            distribution: "gaussian"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
        rigid_body_properties:
          mass:
            range: [0.5, 1.5]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
      object:
        scale:
          range: [0.5, 2.0]
          operation: "scaling"
          distribution: "uniform"
          schedule: "linear"  # "linear" will scale the current random sample by ``min(current num steps, schedule_steps) / schedule_steps`
          schedule_steps: 1
        rigid_body_properties:
          mass:
            range: [0.5, 1.5]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by ``min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
        rigid_shape_properties:
          friction:
            num_buckets: 250
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
            schedule: "linear"  # "linear" will scale the current random sample by `min(current num steps, schedule_steps) / schedule_steps`
            schedule_steps: 30000
